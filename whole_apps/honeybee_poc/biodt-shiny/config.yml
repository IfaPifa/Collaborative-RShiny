default:
  rhino_log_level: !expr Sys.getenv("RHINO_LOG_LEVEL", "INFO")
  rhino_log_file: !expr Sys.getenv("RHINO_LOG_FILE", NA)
  base_path: !expr file.path(getwd(), "app", "data", "shared")
  data_path: !expr file.path(getwd(), "app", "data")
  transl_file: !expr file.path(getwd(), "app", "translations", "translations.json")
  cdsapi_url: https://cds.climate.copernicus.eu/api
  cdsapi_key: !expr Sys.getenv("CDSAPI_KEY")
  hda_user: !expr Sys.getenv("HDA_USER")
  hda_password: !expr Sys.getenv("HDA_PASSWORD")
  executor: "docker"

dev:
  rhino_log_level: !expr Sys.getenv("RHINO_LOG_LEVEL", "DEBUG")

# PoC profile: run the simulation through the local Plumber backend over
# statesnap JSON/HTTP instead of the NetLogo container. Activate with
# R_CONFIG_ACTIVE=poc. See whole_apps/honeybee_poc/README.md.
poc:
  rhino_log_level: !expr Sys.getenv("RHINO_LOG_LEVEL", "DEBUG")
  executor: "plumber"
  backend_url: !expr Sys.getenv("BEEHAVE_BACKEND_URL", "http://localhost:8000")

local_docker:
  base_path: !expr Sys.getenv("BASE_PATH")
  data_path: !expr Sys.getenv("DATA_PATH")
  host_base_path: !expr Sys.getenv("HOST_BASE_PATH")
  transl_file: !expr Sys.getenv("TRANSL_FILE")
  cdsapi_url: !expr Sys.getenv("CDSAPI_URL")
  cdsapi_key: !expr Sys.getenv("CDSAPI_KEY")
  hda_user: !expr Sys.getenv("HDA_USER")
  hda_password: !expr Sys.getenv("HDA_PASSWORD")
  executor: "docker"

prod:
  base_path: !expr Sys.getenv("BASE_PATH")
  data_path: !expr Sys.getenv("DATA_PATH")
  transl_file: !expr Sys.getenv("TRANSL_FILE")
  cdsapi_url: !expr Sys.getenv("CDSAPI_URL")
  cdsapi_key: !expr Sys.getenv("CDSAPI_KEY")
  hda_user: !expr Sys.getenv("HDA_USER")
  hda_password: !expr Sys.getenv("HDA_PASSWORD")
  executor: "docker"

k8s:
  base_path: !expr Sys.getenv("BASE_PATH")
  data_path: !expr Sys.getenv("DATA_PATH")
  api_url: !expr Sys.getenv("KUBERNETES_API_URL")
  namespace: !expr Sys.getenv("KUBERNETES_NAMESPACE")
  token: !expr Sys.getenv("KUBERNETES_API_TOKEN")
  shinyproxy_id: !expr Sys.getenv("SHINYPROXY_ID")
  transl_file: !expr Sys.getenv("TRANSL_FILE")
  cdsapi_url: !expr Sys.getenv("CDSAPI_URL")
  cdsapi_key: !expr Sys.getenv("CDSAPI_KEY")
  hda_user: !expr Sys.getenv("HDA_USER")
  hda_password: !expr Sys.getenv("HDA_PASSWORD")
  executor: "k8s"
