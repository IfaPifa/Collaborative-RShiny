server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to Spring Boot backend
    location /api/ {
        proxy_pass http://spring-backend:8085/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Compute-intensive apps (e.g. MLTrainer RandomForest) can take far
        # longer than nginx's 60s default. Without these, requests are capped
        # at exactly 60s, invalidating the per-app latency benchmarks.
        proxy_connect_timeout 900s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;
    }

    # Proxy WebSocket connections to Spring Boot
    location /ws-shiny/ {
        proxy_pass http://spring-backend:8085/ws-shiny/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Angular SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}